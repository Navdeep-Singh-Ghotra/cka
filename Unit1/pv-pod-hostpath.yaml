apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: null
  labels:
    run: pv-pod
  name: pv-pod
spec:
  volumes:
    - name: pv-stor
      persistentVolumeClaim:
        claimName: pv-claim

  containers:
  - image: nginx
    name: pv-pod
    ports:
      - containerPort: 80
        name: "http-server"
    resources: {}
    volumeMounts:
      - mountPath: "/usr/share/nginx/html"
        name: pv-stor
