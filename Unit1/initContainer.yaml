apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: null
  labels:
    run: nginx
  name: nginx
spec:
  containers:
  - image: nginx
    name: nginx
    resources: {}
  initContainers:
  - image: busybox
    name: initcontainer
    command: ['sh', '-c'] # command to run
    args: # arguments to the command
      - > # multi-line string
        until nslookup        myservice.default.svc.cluster.local; do
         echo waiting for myservice;
         sleep 2;
        done;
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
